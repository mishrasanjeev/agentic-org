#
# Exact `for` boundaries: silent one side, firing the other.
#
# promtool test rules monitoring/prometheus/agenticorg-alerts-windows.test.yml
#
# Written during the independent review of the metrics export, and kept because they cover cases
# the first set did not.
# A `for` window is easy to write and easy to get wrong by a factor of the range window, which is
# how the spend-cap alert was wrong at first: its rate window closed before its `for` elapsed, so it
# never fired at all. These pin both edges to the minute, and pin the cap alert still firing at
# 170m and clearing once the event leaves its 2h lookback at 200m.
rule_files:
  - agenticorg-alerts.yml
evaluation_interval: 1m
tests:
  # Chain failure: for: 5m. The single failure lands at t=60m, so the alert must be
  # silent at t=64m and firing at t=66m.
  - interval: 1m
    name: chain failure honours its five minute for window
    input_series:
      - series: 'agenticorg_chain_verifications_total{outcome="failed"}'
        values: '0+0x60 1+0x60'
    alert_rule_test:
      - eval_time: 64m
        alertname: AgenticOrgChainVerificationFailure
        exp_alerts: []
      - eval_time: 67m
        alertname: AgenticOrgChainVerificationFailure
        exp_alerts:
          - exp_labels: {severity: critical, area: evidence}
            exp_annotations:
              summary: "Stored evidence failed verification against its recorded digest"
              description: "A cited passage or a promotion-history chain did not match its digest. The content is refused rather than shown, so nothing unverified reaches a reviewer, but the stored copy needs investigating."
              runbook: docs/operations/metrics.md#chain-verification-failure

  # Spend cap: for: 10m, increase() over [2h]. Event at t=60m.
  - interval: 1m
    name: spend cap honours its ten minute for window and its two hour lookback
    input_series:
      - series: 'agenticorg_budget_cap_events_total{outcome="exhausted"}'
        values: '0+0x60 1+0x200'
    alert_rule_test:
      - eval_time: 69m
        alertname: AgenticOrgSpendCapExhaustion
        exp_alerts: []
      - eval_time: 72m
        alertname: AgenticOrgSpendCapExhaustion
        exp_alerts:
          - exp_labels: {severity: warning, area: cost}
            exp_annotations:
              summary: "A spend cap has been exhausted and work is being refused"
              description: "Budget evaluation crossed a cap rather than a warning point. Work under that budget is refused until the cap is raised or the period rolls over."
              runbook: docs/operations/metrics.md#spend-cap-exhaustion
      # Still visible well after the for elapsed, because the range window is 2h.
      - eval_time: 170m
        alertname: AgenticOrgSpendCapExhaustion
        exp_alerts:
          - exp_labels: {severity: warning, area: cost}
            exp_annotations:
              summary: "A spend cap has been exhausted and work is being refused"
              description: "Budget evaluation crossed a cap rather than a warning point. Work under that budget is refused until the cap is raised or the period rolls over."
              runbook: docs/operations/metrics.md#spend-cap-exhaustion
      # And gone once the event falls out of the 2h window entirely.
      - eval_time: 200m
        alertname: AgenticOrgSpendCapExhaustion
        exp_alerts: []
