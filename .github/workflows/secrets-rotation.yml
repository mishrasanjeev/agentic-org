name: Secrets rotation

# Manual (workflow_dispatch only) rotation of long-lived secrets. The
# workflow creates new versions of each secret in Google Secret Manager,
# then rolls the Cloud Run API service so it picks up the new version.
# A 24-hour "dual-read" window keeps the previous version enabled so
# in-flight tokens still validate.
#
# This job is intentionally NOT scheduled: an unattended rotation of a key
# that also encrypts data at rest would silently orphan that data.
#
# NOTE: AGENTICORG_SECRET_KEY is deliberately excluded from the default
# rotation set. It is also the credential-vault key fallback, so rotating
# it without rewrapping stored connector secrets makes them undecryptable.
# Rotate it only via the documented rewrap procedure in
# core/crypto/rewrap.py (generate new key -> rewrap -> cut over).

on:
  workflow_dispatch:
    inputs:
      secrets:
        description: "Comma-separated list of secret IDs to rotate (default: all)"
        required: false
        default: ""
      dry_run:
        description: "Set to 'true' to plan without rotating"
        required: false
        default: "false"

permissions:
  contents: read
  id-token: write

jobs:
  rotate:
    name: Rotate secrets
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve secrets to rotate
        id: resolve
        run: |
          if [ -n "${{ inputs.secrets }}" ]; then
            echo "secrets=${{ inputs.secrets }}" >> "$GITHUB_OUTPUT"
          else
            # Default rotation set — see docs/SECRETS_ROTATION.md.
            # AGENTICORG_SECRET_KEY is excluded on purpose: it doubles as the
            # credential-vault key fallback and must go through
            # core/crypto/rewrap.py, never a blind version bump.
            echo "secrets=AGENTICORG_WEBHOOK_SECRET,GRANTEX_API_KEY" >> "$GITHUB_OUTPUT"
          fi

      - name: Rotate each secret
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          IFS=',' read -r -a SECRETS <<< "${{ steps.resolve.outputs.secrets }}"
          for SECRET in "${SECRETS[@]}"; do
            if [ "$SECRET" = "AGENTICORG_SECRET_KEY" ]; then
              echo "::error::Refusing to rotate AGENTICORG_SECRET_KEY here; use core/crypto/rewrap.py" >&2
              exit 1
            fi
            echo "Rotating $SECRET"
            NEW_VALUE=$(openssl rand -base64 48)
            printf "%s" "$NEW_VALUE" | \
              gcloud secrets versions add "$SECRET" \
                --data-file=- \
                --project=${{ secrets.GCP_PROJECT_ID }}
          done

      - name: Roll the Cloud Run API service so it picks up the new version
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          # The GKE cluster was removed in the Cloud Run migration; the API
          # now runs as the agenticorg-api Cloud Run service. Secrets are
          # mounted as ":latest", so a new revision is enough to pick up the
          # rotated version.
          gcloud run services update agenticorg-api \
            --region="${{ vars.CLOUD_RUN_REGION || 'asia-southeast1' }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --update-labels="secrets-rotated=${{ github.run_id }}"

      - name: Announce rotation
        run: |
          echo "Secrets rotated: ${{ steps.resolve.outputs.secrets }}"
          echo "Disable the previous secret versions manually after the 24h dual-read window."
