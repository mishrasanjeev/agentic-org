name: Secrets rotation

# Manual (workflow_dispatch only) rotation of long-lived HMAC/shared
# secrets that the platform generates itself. The workflow creates a new
# version of each named secret in Google Secret Manager, then rolls the
# Cloud Run API, worker and beat services so every runtime picks it up.
#
# Secrets are mounted as ":latest": the new revision reads the new value
# immediately and there is no dual-read window in the application. The
# previous Secret Manager version stays enabled only so an operator can
# roll back; disable it manually once the rollout is verified.
#
# This job is intentionally NOT scheduled: an unattended rotation of a key
# that also encrypts data at rest would silently orphan that data.
#
# Only self-generated secrets may be rotated here (explicit ``secrets``
# input, e.g. CDC_WEBHOOK_SECRET_<CONNECTOR>). Refused:
#   - AGENTICORG_SECRET_KEY: also the credential-vault key fallback; rotate
#     only via core/crypto/rewrap.py (generate new key -> rewrap -> cut over).
#   - GRANTEX_API_KEY: issued by Grantex and validated upstream; a locally
#     generated random value is simply invalid and takes every governed
#     tool call down. Re-issue it in the Grantex console and paste it in.

on:
  workflow_dispatch:
    inputs:
      secrets:
        description: "Comma-separated Secret Manager IDs to rotate (required, e.g. CDC_WEBHOOK_SECRET_ZOHO_BOOKS)"
        required: true
        default: ""
      dry_run:
        description: "Set to 'true' to plan without rotating"
        required: false
        default: "false"

permissions:
  contents: read
  id-token: write

jobs:
  rotate:
    name: Rotate secrets
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve secrets to rotate
        id: resolve
        run: |
          # No implicit default set: the inbound-webhook secrets are per
          # connector (CDC_WEBHOOK_SECRET_<CONNECTOR>) and externally issued
          # credentials must never be replaced with random bytes.
          if [ -z "${{ inputs.secrets }}" ]; then
            echo "::error::Pass the 'secrets' input explicitly (e.g. CDC_WEBHOOK_SECRET_ZOHO_BOOKS). See docs/SECRETS_ROTATION.md." >&2
            exit 1
          fi
          echo "secrets=${{ inputs.secrets }}" >> "$GITHUB_OUTPUT"

      - name: Rotate each secret
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          IFS=',' read -r -a SECRETS <<< "${{ steps.resolve.outputs.secrets }}"
          for SECRET in "${SECRETS[@]}"; do
            SECRET="$(echo "$SECRET" | xargs)"
            case "$SECRET" in
              AGENTICORG_SECRET_KEY)
                echo "::error::Refusing to rotate AGENTICORG_SECRET_KEY here; use core/crypto/rewrap.py" >&2
                exit 1 ;;
              GRANTEX_API_KEY|*GRANTEX*|*_API_KEY|STRIPE_*|PLURAL_*|PINELABS_*|SENDGRID_*|TWILIO_*|GOOGLE_*|OPENAI_*|ANTHROPIC_*)
                echo "::error::Refusing to rotate $SECRET: it is issued by an external provider and must be re-issued there, not replaced with random bytes." >&2
                exit 1 ;;
            esac
            echo "Rotating $SECRET"
            NEW_VALUE=$(openssl rand -base64 48)
            printf "%s" "$NEW_VALUE" | \
              gcloud secrets versions add "$SECRET" \
                --data-file=- \
                --project=${{ secrets.GCP_PROJECT_ID }}
          done

      - name: Roll the Cloud Run API, worker and beat services so they pick up the new version
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          # The GKE cluster was removed in the Cloud Run migration. Secrets
          # are mounted as ":latest", so a new revision is enough to pick up
          # the rotated version - on every runtime that reads it, not only
          # the API (the Celery worker/beat verify CDC webhooks and call
          # providers too).
          for SVC in agenticorg-api agenticorg-worker agenticorg-beat; do
            gcloud run services update "$SVC" \
              --region="${{ vars.CLOUD_RUN_REGION || 'asia-southeast1' }}" \
              --project="${{ secrets.GCP_PROJECT_ID }}" \
              --update-labels="secrets-rotated=${{ github.run_id }}"
          done

      - name: Announce rotation
        run: |
          echo "Secrets rotated: ${{ steps.resolve.outputs.secrets }}"
          echo "Services now read the new version. Update the sending side (connector/provider console) to the new value,"
          echo "verify deliveries, then disable the previous Secret Manager versions manually."
