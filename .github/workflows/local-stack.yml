name: Local Stack

# The one-command developer path, exactly as a contributor runs it, on fresh
# runners: `make check`, and `make dev && make test` with the coverage gate,
# `make seed` and the browser suite against the running stack. Only Docker and
# make are used; every tool runs in the images the repository builds.
# See docs/quickstart-local.md ("Tests and checks", "CI").

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-stack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the comparison base
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="origin/main" ;;
          esac
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "::error::no comparison base for this event"
            exit 1
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"
      - name: make check
        run: make check BASE_REF="${{ steps.base.outputs.ref }}"

  dev-and-test:
    name: make dev && make test
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Free disk space for the stack images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: make dev
        run: make dev
      - name: make test
        run: make test
      - name: Coverage gate (75% of changed lines, 75% of each new module)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make coverage-gate BASE_REF="$PR_BASE_SHA"
      - name: make seed
        run: make seed
      - name: make e2e
        run: make e2e
      - name: Stack status and logs
        if: failure()
        run: |
          docker compose -f docker-compose.dev.yml ps --all
          docker compose -f docker-compose.dev.yml logs --no-color --tail 200
      - name: Upload coverage and browser reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-stack-${{ github.sha }}
          path: |
            coverage.xml
            ui/playwright-report/dev-stack
            ui/test-results/dev-stack
          if-no-files-found: ignore
          retention-days: 14
      - name: make clean
        if: always()
        run: make clean
