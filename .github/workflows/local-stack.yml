name: Local Stack

# The one-command developer path, exactly as a contributor runs it, on fresh
# runners: `make check`, and `make dev && make test` with the coverage gate,
# `make seed`, `make seed-cases` and the browser suite against the running
# stack; and the decision-grant suite against a stack started with decision
# grants on. Only Docker and make are used (plus the runner's `openssl` to
# generate each run's seed password and administrator key); every tool runs in
# the images the repository builds.
# See docs/quickstart-local.md ("Tests and checks", "CI").

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-stack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the comparison base
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="origin/main" ;;
          esac
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "::error::no comparison base for this event"
            exit 1
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"
      - name: make check
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: make check BASE_REF="$BASE"

  dev-and-test:
    name: make dev && make test
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # The governed-case suites skip when the seed or the seed password is
      # missing; here that fails the run instead, so a wiring change that
      # stops them reaching the runner cannot leave this job green.
      AGENTICORG_E2E_REQUIRE_GOVERNED_CASES: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Free disk space for the stack images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: make dev
        run: make dev
      - name: make test
        run: make test
      - name: Coverage gate (75% of changed lines, 75% of each new module)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make coverage-gate BASE_REF="$PR_BASE_SHA"
      # The governed-case suites sign in as the seeded users, so the seed
      # needs a password; it is generated for this run only. They run on this
      # stack, which has no decision-grant issuer, because
      # governed-cases-decision.spec.ts asserts exactly that refusal.
      - name: Generate this run's seed password
        run: |
          set -euo pipefail
          seed_password="$(openssl rand -hex 24)"
          echo "::add-mask::$seed_password"
          echo "AGENTICORG_SEED_PASSWORD=$seed_password" >> "$GITHUB_ENV"
      - name: make seed
        run: make seed
      - name: make seed-cases
        run: make seed-cases
      - name: make e2e
        run: make e2e
      - name: Stack status and logs
        if: failure()
        run: |
          docker compose -f docker-compose.dev.yml ps --all
          docker compose -f docker-compose.dev.yml logs --no-color --tail 200
      - name: Upload coverage and browser reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-stack-${{ github.sha }}
          path: |
            coverage.xml
            ui/playwright-report/dev-stack
            ui/test-results/dev-stack
          if-no-files-found: ignore
          retention-days: 14
      - name: make clean
        if: always()
        run: make clean

  # The cross-repository decision-grant join (docs/governance/decision-requests.md):
  # the console and the API against the real Grantex auth service, with each
  # approval taken in a browser on the auth service's own page. The seed
  # password and the auth service's administrator key are generated for this
  # run only and never leave the runner.
  decision-grants:
    name: make e2e-decisions
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AGENTICORG_DEV_DECISION_GRANTS: "true"
      AGENTICORG_DEV_CASE_DECISION_SERVICE: grantex
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Free disk space for the stack images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Generate this run's seed password and administrator key
        run: |
          set -euo pipefail
          seed_password="$(openssl rand -hex 24)"
          admin_key="$(openssl rand -hex 32)"
          echo "::add-mask::$seed_password"
          echo "::add-mask::$admin_key"
          {
            echo "AGENTICORG_SEED_PASSWORD=$seed_password"
            echo "AGENTICORG_DEV_GRANTEX_ADMIN_KEY=$admin_key"
          } >> "$GITHUB_ENV"
      - name: make dev
        run: make dev
      - name: make seed
        run: make seed
      - name: make seed-cases
        run: make seed-cases
      - name: make e2e-decisions
        run: make e2e-decisions
      - name: Stack status and logs
        if: failure()
        run: |
          docker compose -f docker-compose.dev.yml --profile decisions ps --all
          docker compose -f docker-compose.dev.yml --profile decisions logs --no-color --tail 200
      - name: Upload the browser report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: decision-grants-${{ github.sha }}
          path: |
            ui/playwright-report/decision-grants
            ui/test-results/decision-grants
            ui/test-results/governed-cases-seed.json
          if-no-files-found: ignore
          retention-days: 14
      - name: make clean
        if: always()
        run: make clean
