    add_header Content-Security-Policy "default-src 'self'; script-src 'self' $csp_jsonld_hashes_1 $csp_jsonld_hashes_2 https://accounts.google.com https://apis.google.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://*.googleusercontent.com https://www.googletagmanager.com https://www.google-analytics.com; font-src 'self' data:; connect-src 'self' wss: ws: https://accounts.google.com https://oauth2.googleapis.com https://www.google-analytics.com https://analytics.google.com; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';" always;

    # ── Static assets — long cache (hashed filenames from Vite/Webpack) ───────
    # If a chunk is missing (stale index.html references old build), serve
    # index.html so the SPA reloads with fresh chunk references.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Favicon, manifest, robots, sitemap — moderate cache ───────────────────
    # NOTE: Uses ^~ prefix to NOT match /api/ paths (those go to proxy below)
    location ~* ^/(?!api/|ws/).*\.(svg|ico|json|txt|xml)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── API proxy — ^~ prefix prevents regex from stealing /api/*.json ──────
    location ^~ /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;

        client_max_body_size 10m;
    }

    # ── WebSocket proxy ───────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    # ── Health check endpoint ─────────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # ── LLMs.txt for AI search engines ──────────────────────────────────────
    location = /llms.txt {
        add_header Content-Type text/plain;
        try_files /llms.txt =404;
    }
    location = /llms-full.txt {
        add_header Content-Type text/plain;
        try_files /llms-full.txt =404;
    }
    # Permanent redirects keep one canonical URL for duplicate legal/contact routes.
    location = /contact {
        return 301 https://agenticorg.ai/support;
    }
    location = /privacy-policy {
        return 301 https://agenticorg.ai/privacy;
    }
    location = /terms-of-service {
        return 301 https://agenticorg.ai/terms;
    }
    location = /refund-policy {
        return 301 https://agenticorg.ai/refund;
    }
    location = /cancellation {
        return 301 https://agenticorg.ai/refund;
    }

    # Preserve historical blog URLs whose articles were consolidated into
    # current canonical resources or solution pages. These redirects prevent
    # stale Search Console links from becoming hard 404s.
    location = /blog/ai-invoice-processing-india {
        return 301 https://agenticorg.ai/resources/ai-accounts-payable-automation;
    }
    location = /blog/why-month-end-close-takes-5-days {
        return 301 https://agenticorg.ai/resources/month-end-close-automation;
    }
    location = /blog/measuring-real-roi-from-ai-agents {
        return 301 https://agenticorg.ai/resources/enterprise-ai-automation-platform;
    }
    location = /blog/200-person-it-company-cfo-ai-agents {
        return 301 https://agenticorg.ai/solutions/cfo;
    }
    location = /blog/ca-firm-ai-agent-end-to-end {
        return 301 https://agenticorg.ai/solutions/ca-firms;
    }

    # Authenticated and authentication-flow pages remain usable but are not
    # search results. The server-level X-Robots-Tag map supplies the header.
    location ~ ^/(?:dashboard(?:/.*)?|login/?|signup/?|forgot-password/?|reset-password/?|invite/?|accept-invite/?|onboarding/?|sso/callback/?)$ {
        try_files $uri $uri.html /index.html;
    }

    # Known content slugs have generated HTML files. Unknown slugs are genuine
    # 404s instead of returning the homepage as a soft 404.
    location ^~ /blog/ {
        try_files $uri $uri.html =404;
    }
    location ^~ /resources/ {
        try_files $uri $uri.html =404;
    }
    # index.html is never cached so chunk references stay current.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── Explicit 404 page — returns real HTTP 404 for SEO ───────────────────
    location = /404 {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 404;
    }

    # ── SPA fallback — no cache on HTML ───────────────────────────────────────
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri.html /index.html;
    }
}
