# Search indexing policy derived from the original request URI. Empty values are
# not emitted, so public routes do not receive a redundant X-Robots-Tag.
map $request_uri $seo_robots_tag {
    default "";
    ~^/(?:(?:dashboard|solutions/(?:ai-invoice-processing|automated-bank-reconciliation|payroll-automation))(?:/|\?|$)|(?:login|signup|forgot-password|reset-password|invite|accept-invite|onboarding|sso/callback)/?(?:\?|$)) "noindex, nofollow";
}
# =============================================================================
# AgenticOrg — Production Nginx Configuration
# =============================================================================

# ── Hide nginx version ──────────────────────────────────────────────────────
server_tokens off;
add_header_inherit merge;

# ── Gzip compression ─────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

# ── Upstream backends ─────────────────────────────────────────────────────────
upstream api_backend {
    server agenticorg-api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Strip trailing slashes (fixes GSC "Alternative page with canonical") ─
    rewrite ^(.+)/$ https://$host$1 permanent;

    # ── Custom error pages — serve SPA instead of nginx default ──────────────
    error_page 502 503 504 /index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Robots-Tag $seo_robots_tag always;
