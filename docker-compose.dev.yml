# Local development stack: `make dev` (see docs/quickstart-local.md).
#
# Needs only Docker and make. Every base image is pinned by digest; ports bind
# to 127.0.0.1 and can be moved with the AGENTICORG_DEV_*_PORT variables. The
# credentials below are development-only placeholders; production and staging
# reject them.
#
# No model credentials are needed to start the stack. Completions made through
# core/llm/router.py use the deterministic fake LLM
# (core/test_doubles/fake_llm.py), honoured only in development and test
# environments. LangGraph agent runs build their model through
# core/langgraph/llm_factory.py; an agent whose model is
# `vllm:scripted/<script>` (or any `vllm:` model with a recorded cassette) is
# answered by the model-stub service below, with no credentials.

name: agenticorg-dev

x-backend-env: &backend-env
  AGENTICORG_ENV: development
  AGENTICORG_DB_URL: postgresql+asyncpg://agenticorg:agenticorg_dev@postgres:5432/agenticorg
  AGENTICORG_REDIS_URL: redis://redis:6379/0
  AGENTICORG_STORAGE_BUCKET: agenticorg-docs-dev
  AGENTICORG_STORAGE_ENDPOINT: http://minio:9000
  AGENTICORG_SECRET_KEY: agenticorg-dev-only-do-not-use-in-production
  AGENTICORG_PII_MASKING: "true"
  AGENTICORG_TEST_FAKE_LLM: "1"
  # The registered "mock" verification provider calls the mock-provider service.
  AGENTICORG_MOCK_PROVIDER_URL: http://mock-provider:8080
  # `vllm:` models go to the OpenAI-compatible model stub (tools/model_stub).
  VLLM_BASE_URL: http://model-stub:8080
  # Local Grantex auth service (grantex service below); the key is the
  # development developer key it seeds at start. The service listens on the
  # same port inside and outside its container - see the grantex service.
  GRANTEX_BASE_URL: http://grantex:${AGENTICORG_DEV_GRANTEX_PORT:-3001}
  GRANTEX_API_KEY: agenticorg-dev-grantex-api-key
  # Decision requests (PRD G-3, docs/governance/decision-requests.md). The
  # stack now serves them, but the flag stays OFF unless a run sets it: it
  # defaults off everywhere, development included.
  AGENTICORG_CASE_DECISION_SERVICE: "${AGENTICORG_DEV_CASE_DECISION_SERVICE:-}"
  AGENTICORG_CASE_DECISION_FOUR_EYES_ON: "${AGENTICORG_DEV_CASE_DECISION_FOUR_EYES_ON:-decline}"

x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: agenticorg
      POSTGRES_USER: agenticorg
      POSTGRES_PASSWORD: agenticorg_dev
    ports:
      - "127.0.0.1:${AGENTICORG_DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenticorg -d agenticorg"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${AGENTICORG_DEV_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agenticorg
      MINIO_ROOT_PASSWORD: agenticorg_dev
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot, idempotent schema bootstrap/upgrade (Alembic is the schema authority).
  migrate:
    build: *backend-build
    image: agenticorg-api:dev
    environment: *backend-env
    command: python scripts/alembic_migrate.py
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: agenticorg-api:dev
    pull_policy: never
    environment: *backend-env
    ports:
      - "127.0.0.1:${AGENTICORG_DEV_API_PORT:-8000}:8000"
    networks:
      default:
        # ui/nginx.conf proxies /api and /ws to agenticorg-api:8000.
        aliases: [agenticorg-api]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      model-stub:
        condition: service_healthy
      grantex:
        condition: service_healthy

  worker:
    image: agenticorg-api:dev
    pull_policy: never
    environment: *backend-env
    command: >-
      celery -A core.tasks.celery_app worker --loglevel=info --concurrency=2
      -Q celery,reports,maintenance,workflows,delivery,rpa
    healthcheck:
      # The image healthcheck probes the API port, which a worker never serves.
      test: ["CMD-SHELL", "celery -A core.tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 40s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      model-stub:
        condition: service_healthy
      grantex:
        condition: service_healthy

  # The mock verification provider as its own service, so the provider seam is
  # exercised over the network (connectors/providers/mock). It refuses to start
  # unless AGENTICORG_ENV is local, development or test. Its /v1/admin endpoints
  # (fault injection, provider events) answer only when
  # AGENTICORG_DEV_MOCK_PROVIDER_ADMIN=true is set for `make dev`.
  mock-provider:
    image: agenticorg-api:dev
    pull_policy: never
    environment:
      # Only what the mock needs: no database, cache or application secret.
      AGENTICORG_ENV: development
      AGENTICORG_MOCK_PROVIDER_SEED: "0"
      # Fault injection and signed-event endpoints; off unless explicitly enabled.
      AGENTICORG_MOCK_PROVIDER_ADMIN: "${AGENTICORG_DEV_MOCK_PROVIDER_ADMIN:-false}"
    command: ["uvicorn", "connectors.providers.mock.service:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:${AGENTICORG_DEV_MOCK_PROVIDER_PORT:-8081}:8080"
    healthcheck:
      # The image healthcheck probes the API port, which this service does not serve.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4).read()"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      # migrate builds the shared image.
      migrate:
        condition: service_completed_successfully

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: agenticorg-ui:dev
    ports:
      - "127.0.0.1:${AGENTICORG_DEV_UI_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

  # Development OpenID Connect provider with step-up (tools/oidc_stub). The
  # issuer is the browser-facing URL; other containers reach the token, JWKS
  # and userinfo endpoints at http://oidc-stub:9400. Refuses to start unless
  # AGENTICORG_ENV is development, local or test.
  oidc-stub:
    build:
      context: ./tools
      dockerfile: oidc_stub/Dockerfile
    image: agenticorg-oidc-stub:dev
    environment:
      AGENTICORG_ENV: development
      OIDC_STUB_PUBLIC_URL: http://127.0.0.1:${AGENTICORG_DEV_OIDC_PORT:-9400}
      OIDC_STUB_INTERNAL_URL: http://oidc-stub:9400
    ports:
      - "127.0.0.1:${AGENTICORG_DEV_OIDC_PORT:-9400}:9400"

  # OpenAI-compatible model stub (tools/model_stub): `scripted/<name>` models
  # answer from tools/model_stub/scripts, every other model from cassettes in
  # tests/cassettes/model_stub. Replay never calls a model; MODEL_STUB_MODE=record
  # forwards to a real provider and refuses to start without MODEL_RECORD_API_KEY.
  model-stub:
    build:
      context: .
      dockerfile: tools/model_stub/Dockerfile
    image: agenticorg-model-stub:dev
    environment:
      AGENTICORG_ENV: development
      MODEL_STUB_MODE: ${MODEL_STUB_MODE:-replay}
      MODEL_RECORD_API_KEY: ${MODEL_RECORD_API_KEY:-}
    volumes:
      - ./tests/cassettes/model_stub:/cassettes
    ports:
      - "127.0.0.1:${AGENTICORG_DEV_MODEL_STUB_PORT:-8090}:8080"

  # One-shot: a separate `grantex` role and database on the stack's Postgres,
  # so the Grantex auth service never shares tables with the application.
  grantex-db:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      PGHOST: postgres
      PGUSER: agenticorg
      PGPASSWORD: agenticorg_dev
      PGDATABASE: agenticorg
    command:
      - bash
      - -ceu
      - |
        psql -v ON_ERROR_STOP=1 <<'SQL'
        SELECT 'CREATE ROLE grantex LOGIN PASSWORD ''grantex_dev'''
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'grantex')\gexec
        SELECT 'CREATE DATABASE grantex OWNER grantex'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'grantex')\gexec
        SQL
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # Grantex auth service from the published image, pinned by digest. It runs
  # its own migrations at start, keeps its data in the `grantex` database and
  # Redis index 2, generates signing keys, and seeds the development developer
  # key the API uses (GRANTEX_API_KEY above).
  #
  # Pinned to grantex main 5b867f6850eb534ee893fec078037fe84c3668ee, the first
  # image that serves the decision-grant routes and the approval page
  # (`ghcr.io/mishrasanjeev/grantex-auth-service:sha-5b867f68...`, resolved to
  # the multi-architecture index digest below).
  #
  # The approval page is a real browser page on this service's own origin, and
  # the service refuses to run decision grants unless that origin is https or
  # loopback. So the container listens on the *published* port and
  # PUBLIC_BASE_URL names it: the URL in an approver's address bar, the
  # `Origin` the page's form post carries and the origin the service checks it
  # against are then all the same string. Other containers reach the API at
  # `http://grantex:<that port>`.
  grantex:
    image: ghcr.io/mishrasanjeev/grantex-auth-service@sha256:b73668a36b10a7fb1ac5fa9f8f67a6dbadc5a1611d8687c6938d72d64151967d
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "${AGENTICORG_DEV_GRANTEX_PORT:-3001}"
      DATABASE_URL: postgres://grantex:grantex_dev@postgres:5432/grantex
      REDIS_URL: redis://redis:6379/2
      AUTO_GENERATE_KEYS: "true"
      PUBLIC_BASE_URL: http://127.0.0.1:${AGENTICORG_DEV_GRANTEX_PORT:-3001}
      JWT_ISSUER: http://grantex:${AGENTICORG_DEV_GRANTEX_PORT:-3001}
      SEED_API_KEY: agenticorg-dev-grantex-api-key
      LOG_PRETTY: "false"
      # Decision grants (PRD G-3). Off by default in the service; on here so
      # the local stack can take a real approval end to end.
      DECISION_GRANTS_ENABLED: "true"
      # Approver emails are stored as keyed hashes and names encrypted, so the
      # service requires a vault key before it will mint a decision grant. A
      # visibly fake 32-byte development placeholder; production rejects it.
      VAULT_ENCRYPTION_KEY: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
      # CSRF tokens on the approval page; fixed so a restart does not
      # invalidate a page an approver already has open.
      DECISION_PAGE_SECRET: agenticorg-dev-grantex-decision-page-secret
      # Allow-listing an approver identity provider is a service-administrator
      # action; the developer key above cannot do it, by design.
      ADMIN_API_KEY: agenticorg-dev-grantex-admin-key
      # The development identity provider (oidc-approvers below) is reached
      # over http on a loopback address.
      SSO_ALLOW_INSECURE_URLS: "true"
      SSO_ALLOW_PRIVATE_HOSTS: "true"
      # Step-up: the stub's step-up acr, or a second factor in `amr`.
      DECISION_STEP_UP_ACR: urn:agenticorg:acr:step-up
      DECISION_STEP_UP_AMR: mfa,hwk
      DECISION_MIN_DWELL_MS: "${AGENTICORG_DEV_DECISION_MIN_DWELL_MS:-2000}"
    ports:
      - "127.0.0.1:${AGENTICORG_DEV_GRANTEX_PORT:-3001}:${AGENTICORG_DEV_GRANTEX_PORT:-3001}"
      # oidc-approvers shares this network namespace (see below), so its port
      # is published here.
      - "127.0.0.1:${AGENTICORG_DEV_OIDC_APPROVERS_PORT:-9401}:${AGENTICORG_DEV_OIDC_APPROVERS_PORT:-9401}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
    depends_on:
      grantex-db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The identity provider approvers sign in with, for decision grants only
  # (tools/oidc_stub with its own fixture users). It shares the auth service's
  # network namespace so that one URL - http://127.0.0.1:<port> - names the
  # issuer from the auth service, from the approver's browser and in the
  # discovery document. OpenID Connect discovery requires all three to be the
  # same string, and the auth service will not take an approval on an origin
  # that is neither https nor loopback.
  oidc-approvers:
    build:
      context: ./tools
      dockerfile: oidc_stub/Dockerfile
    image: agenticorg-oidc-stub:dev
    network_mode: "service:grantex"
    environment:
      AGENTICORG_ENV: development
      OIDC_STUB_PORT: "${AGENTICORG_DEV_OIDC_APPROVERS_PORT:-9401}"
      OIDC_STUB_PUBLIC_URL: http://127.0.0.1:${AGENTICORG_DEV_OIDC_APPROVERS_PORT:-9401}
      OIDC_STUB_CONFIG: /etc/oidc-stub/approvers.json
      # The auth service's callback carries its port, which is configurable
      # here, so it is added to the fixture client rather than baked into it.
      OIDC_STUB_EXTRA_REDIRECT_URIS: http://127.0.0.1:${AGENTICORG_DEV_GRANTEX_PORT:-3001}/decisions/callback
    volumes:
      - ./tools/oidc_stub/config.approvers.dev.json:/etc/oidc-stub/approvers.json:ro
    depends_on:
      grantex:
        condition: service_healthy

  # Test and check runner for `make test` and `make check`; `make dev` never
  # starts it. The checkout is mounted, so code changes need no rebuild.
  tools:
    profiles: [tools]
    build:
      context: .
      dockerfile: Dockerfile.tools
    image: agenticorg-tools:dev
    working_dir: /src
    volumes:
      - .:/src
    healthcheck:
      disable: true

  # Playwright runner for `make e2e`, against the console on this network.
  e2e:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    working_dir: /src
    environment:
      BASE_URL: http://ui
      CI: "true"
    volumes:
      - .:/src
      # Container-only dependencies, kept apart from any host ui/node_modules.
      - e2e-node-modules:/src/ui/node_modules
    ipc: host
    healthcheck:
      disable: true

volumes:
  pgdata:
  redisdata:
  miniodata:
  e2e-node-modules:
