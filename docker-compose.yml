
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agenticorg
      POSTGRES_USER: agenticorg
      POSTGRES_PASSWORD: agenticorg_dev
    ports:
      - "5432:5432"
    volumes:
      # NOTE: ./migrations is intentionally NOT mounted into
      # /docker-entrypoint-initdb.d. The legacy raw-SQL files there run
      # ``CREATE EXTENSION "pgvector"`` (the extension is named ``vector``),
      # which aborts initdb on the pgvector image and left this stack unable
      # to boot from a fresh volume. Alembic is the sole schema authority
      # (migrations/README.md); the ``migrate`` service below applies it.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenticorg"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  s3mock:
    # Local-only S3 emulator; production uses its configured object store.
    image: adobe/s3mock@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    mem_limit: 768m
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: agenticorg-docs-dev
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - s3mockdata:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/favicon.ico"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # One-shot schema bootstrap/upgrade. Runs scripts/alembic_migrate.py
  # (idempotent: fresh DB, legacy DB, or already-managed DB) and exits 0.
  # api/worker/beat wait on it via service_completed_successfully, mirroring
  # the pre-rollout migrate step used for production deploys.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AGENTICORG_ENV: development
      AGENTICORG_DB_URL: postgresql+asyncpg://agenticorg:agenticorg_dev@postgres:5432/agenticorg
      AGENTICORG_REDIS_URL: redis://redis:6379/0
      AGENTICORG_SECRET_KEY: agenticorg-dev-only-do-not-use-in-production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    healthcheck:
      disable: true
    restart: "no"
    command: python scripts/alembic_migrate.py

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      AGENTICORG_ENV: development
      AGENTICORG_DB_URL: postgresql+asyncpg://agenticorg:agenticorg_dev@postgres:5432/agenticorg
      AGENTICORG_REDIS_URL: redis://redis:6379/0
      AGENTICORG_STORAGE_BUCKET: agenticorg-docs-dev
      AGENTICORG_STORAGE_ENDPOINT: http://s3mock:9090
      # Local-dev only. Real environments must inject via secret manager.
      # LOW-15: predictable defaults are rejected in production/staging code paths.
      AGENTICORG_SECRET_KEY: agenticorg-dev-only-do-not-use-in-production
      AGENTICORG_PII_MASKING: "true"
      AGENTICORG_LOG_LEVEL: DEBUG
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3mock:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AGENTICORG_ENV: development
      AGENTICORG_DB_URL: postgresql+asyncpg://agenticorg:agenticorg_dev@postgres:5432/agenticorg
      AGENTICORG_REDIS_URL: redis://redis:6379/0
      AGENTICORG_STORAGE_BUCKET: agenticorg-docs-dev
      AGENTICORG_STORAGE_ENDPOINT: http://s3mock:9090
      # Local-dev only. Real environments must inject via secret manager.
      # LOW-15: predictable defaults are rejected in production/staging code paths.
      AGENTICORG_SECRET_KEY: agenticorg-dev-only-do-not-use-in-production
      AGENTICORG_PII_MASKING: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The image HEALTHCHECK probes the API's HTTP liveness endpoint, which a
    # bare celery worker never serves -> the container would sit at
    # "unhealthy" forever. Probe the worker itself instead.
    healthcheck:
      test: ["CMD-SHELL", "celery -A core.tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 40s
      retries: 3
    command: celery -A core.tasks.celery_app worker --loglevel=info --concurrency=4 -Q celery,reports,maintenance,workflows,delivery,rpa

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8000"
      AGENTICORG_ENV: development
      AGENTICORG_DB_URL: postgresql+asyncpg://agenticorg:agenticorg_dev@postgres:5432/agenticorg
      AGENTICORG_REDIS_URL: redis://redis:6379/0
      # Local-dev only. Real environments must inject via secret manager.
      AGENTICORG_SECRET_KEY: agenticorg-dev-only-do-not-use-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # run_beat.py serves a stub HTTP endpoint on $PORT; probe that instead of
    # the API liveness path baked into the image.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    command: python scripts/run_beat.py

  # ── Air-gapped: Ollama (CPU) ──────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    profiles:
      - airgap
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 16G

  # ── Air-gapped: vLLM (GPU) ──────────────────────────────────────
  vllm:
    image: vllm/vllm-openai:latest
    profiles:
      - airgap-gpu
    ports:
      - "8001:8000"
    volumes:
      - vllm_models:/root/.cache/huggingface
    environment:
      VLLM_API_KEY: vllm
    command: >
      --model meta-llama/Llama-3.1-70B-Instruct
      --max-model-len 8192
      --tensor-parallel-size 1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── RAG: RAGFlow ────────────────────────────────────────────────────
  ragflow:
    image: infiniflow/ragflow:latest
    ports:
      - "9380:9380"
    volumes:
      - ragflow_data:/ragflow/data
    profiles:
      - ragflow
    restart: unless-stopped

  # ── Voice: LiveKit ─────────────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"
      - "7881:7881"
    profiles:
      - voice
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  s3mockdata:
  ollama_data:
  vllm_models:
  ragflow_data:
